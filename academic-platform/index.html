<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Academic Training Platform - Advanced training for PhD students and early career professors in econometrics and research methodology" />
    <meta name="keywords" content="academic training, econometrics, research methodology, PhD, professors, online courses" />
    <meta name="author" content="Academic Training Platform" />

    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Academic Training Platform - Excellence in Research Training" />
    <meta property="og:description" content="Empowering PhD students and early career professors with cutting-edge econometrics and research methodology training" />

    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Academic Training Platform" />
    <meta name="twitter:description" content="Advanced training for academic excellence" />

    <link rel="icon" type="image/svg+xml" href="/graduation-cap.svg" />
    <title>Academic Training Platform - Advanced Research Training</title>

    <!-- Tailwind CSS CDN for development -->
    <script src="https://cdn.tailwindcss.com"></script>

    <style>
      /* Custom animations */
      @keyframes fade-in {
        from {
          opacity: 0;
        }
        to {
          opacity: 1;
        }
      }

      @keyframes fade-in-up {
        from {
          opacity: 0;
          transform: translateY(20px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }

      .animate-fade-in {
        animation: fade-in 0.6s ease-out;
      }

      .animate-fade-in-up {
        animation: fade-in-up 0.8s ease-out;
      }

      /* Smooth scrolling */
      html {
        scroll-behavior: smooth;
      }

      /* Custom scrollbar */
      ::-webkit-scrollbar {
        width: 10px;
      }

      ::-webkit-scrollbar-track {
        background: #1a1a1a;
      }

      ::-webkit-scrollbar-thumb {
        background: #3b82f6;
        border-radius: 5px;
      }

      ::-webkit-scrollbar-thumb:hover {
        background: #2563eb;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
